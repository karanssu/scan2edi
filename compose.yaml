services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scan2edi}
      POSTGRES_USER: ${POSTGRES_USER:-scan2edi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scan2edi} -d ${POSTGRES_DB:-scan2edi}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./services/api
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./storage/invoices:/data/invoices
      - ./storage/exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ocr:
    build: ./services/ocr
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    expose:
      - "8080"
    volumes:
      - ./storage/invoices:/data/invoices:ro
      - paddle_models:/root/.paddlex
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  paddle_models:
  ollama_data:
